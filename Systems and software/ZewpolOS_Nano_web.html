<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>ZewpolOS nano · real actions</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0b0e14;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
      touch-action: pan-x pan-y;
    }
    #os {
      max-width: 1400px;
      width: 100%;
      height: 96vh;
      min-height: 600px;
      background: rgba(14, 20, 30, 0.8);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 36px;
      padding: 14px 16px 12px 16px;
      box-shadow: 0 30px 60px -12px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      color: #eef2f6;
      transition: all 0.15s;
      touch-action: auto;
      position: relative;
      overflow: hidden;
    }
    #topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px 10px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 6px;
    }
    #logo {
      font-weight: 600;
      font-size: 1.3rem;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, #b7d0f0, #7aa9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    #clock {
      font-size: 0.9rem;
      background: rgba(0,0,0,0.3);
      padding: 6px 16px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.05);
      touch-action: none;
      user-select: none;
      font-variant-numeric: tabular-nums;
    }
    #wifi-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background: rgba(0,0,0,0.2);
      padding: 4px 12px 4px 8px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
      touch-action: manipulation;
    }
    #wifi-status:active { transform: scale(0.95); }
    #workspace {
      display: flex;
      flex: 1;
      gap: 12px;
      padding-top: 10px;
      min-height: 0;
      flex-wrap: wrap;
    }
    #dock {
      width: 88px;
      min-width: 72px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 16px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      overflow-y: auto;
      flex-shrink: 0;
      touch-action: pan-y;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: all 0.15s ease;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      color: #d6e2f5;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
      gap: 2px;
      padding: 4px 0;
    }
    .app-icon .label {
      font-size: 0.55rem;
      opacity: 0.7;
      line-height: 1;
      pointer-events: none;
      white-space: nowrap;
    }
    .app-icon:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255,255,255,0.15);
    }
    .app-icon.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255,255,255,0.1);
      box-shadow: 0 0 20px rgba(100, 180, 255, 0.05);
    }
    #main {
      flex: 1;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(4px);
      border-radius: 28px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      min-width: 200px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.03);
      position: relative;
    }
    #app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
    }
    #app-title {
      font-weight: 500;
      font-size: 1rem;
      background: rgba(255,255,255,0.02);
      padding: 4px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #app-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 6px 16px;
      border-radius: 40px;
      color: #dce6f5;
      font-size: 0.8rem;
      cursor: pointer;
      touch-action: manipulation;
      transition: 0.1s;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.94); background: rgba(255,255,255,0.1); }
    .btn-primary {
      background: rgba(80, 160, 255, 0.15);
      border-color: rgba(80, 160, 255, 0.2);
      color: #8abaff;
    }
    #app-content {
      flex: 1;
      overflow-y: auto;
      padding: 4px 2px 4px 2px;
      border-radius: 20px;
      background: rgba(0,0,0,0.05);
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    #code-area {
      width: 100%;
      height: 100%;
      min-height: 160px;
      background: #0a0f18;
      border: none;
      border-radius: 16px;
      color: #d4e0f0;
      font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
      font-size: 0.85rem;
      padding: 16px;
      resize: vertical;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      touch-action: auto;
      -webkit-overflow-scrolling: touch;
      line-height: 1.6;
      tab-size: 2;
    }
    #code-area:focus { box-shadow: inset 0 0 0 2px rgba(120, 180, 255, 0.15); }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      padding: 8px 4px;
    }
    .app-card {
      background: rgba(255,255,255,0.02);
      border-radius: 18px;
      padding: 16px 8px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.02);
      transition: 0.15s;
      cursor: pointer;
      touch-action: manipulation;
      backdrop-filter: blur(2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .app-card:active { transform: scale(0.94); background: rgba(255,255,255,0.06); }
    .app-card .emoji-big {
      font-size: 2.4rem;
      display: block;
      margin-bottom: 4px;
    }
    .app-card .label {
      font-size: 0.7rem;
      opacity: 0.8;
      word-break: break-word;
    }
    .flex-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 12, 20, 0.92);
      backdrop-filter: blur(16px);
      padding: 12px 28px;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.05);
      color: #d4e4ff;
      font-size: 0.9rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      white-space: nowrap;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 999;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 8px; }
    @media (max-width: 640px) {
      #dock { width: 64px; min-width: 56px; padding: 12px 4px; gap: 6px; }
      .app-icon { width: 48px; height: 48px; font-size: 1.2rem; border-radius: 14px; }
      .app-icon .label { font-size: 0.5rem; }
      #os { padding: 10px; border-radius: 24px; height: 98vh; }
      #main { padding: 10px; }
      .app-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
      .app-card .emoji-big { font-size: 1.8rem; }
      #app-title { font-size: 0.9rem; }
      #wifi-status { font-size: 0.7rem; padding: 2px 8px; }
    }
    .desktop-window {
      background: rgba(10, 16, 26, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.03);
      height: 100%;
      overflow-y: auto;
    }
    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-online { background: #4ade80; box-shadow: 0 0 12px rgba(74, 222, 128, 0.3); }
    .status-offline { background: #f87171; box-shadow: 0 0 12px rgba(248, 113, 113, 0.2); }
    .cloud-apps-section-title {
      font-size: 0.95rem;
      color: #00f260;
      margin: 24px 0 12px;
      text-transform: uppercase;
      border-left: 3px solid #00f260;
      padding-left: 14px;
    }
    .cloud-apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
    }
    .cloud-app-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 20px 12px;
      text-align: center;
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }
    .cloud-app-card:hover {
      transform: translateY(-4px);
      border-color: #00f260;
      background: rgba(255,255,255,0.1);
    }
    .cloud-app-card i {
      font-size: 2.2rem;
      color: #00f260;
      margin-bottom: 10px;
      display: block;
    }
    .cloud-app-card span {
      font-size: 0.75rem;
      opacity: 0.8;
    }
    .note-item {
      background: rgba(255,255,255,0.04);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      border-left: 3px solid #00f260;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .note-item h5 { margin: 0; color: #00f260; font-size: 0.8rem; }
    .note-item p { margin: 2px 0 0; font-size: 0.7rem; opacity: 0.6; }
    .notes-input-area input, .notes-input-area textarea {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 8px 12px;
      color: white;
      outline: none;
      width: 100%;
      margin-bottom: 8px;
      font-family: inherit;
    }
    .notes-input-area input:focus, .notes-input-area textarea:focus {
      border-color: #00f260;
    }
    .sidebar-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }
    .sidebar-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .sidebar-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #00f260;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #sidebar-scroll {
      overflow-y: auto;
      padding: 10px 6px;
      flex: 1;
    }
    #dock-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    /* paint canvas */
    #paintCanvas {
      touch-action: none;
      cursor: crosshair;
      width: 100%;
      height: 300px;
      background: #0a111c;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .color-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .color-swatch {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.2s;
    }
    .color-swatch.active, .color-swatch:hover {
      border-color: white;
      transform: scale(1.1);
    }
    #terminal-output {
      background: #070c14;
      border-radius: 12px;
      padding: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      color: #b8d4f0;
      min-height: 150px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #terminal-input-line {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    #terminal-input {
      flex: 1;
      background: #0a111c;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 6px 12px;
      color: white;
      font-family: 'Fira Code', monospace;
      outline: none;
    }
    #terminal-input:focus { border-color: #00f260; }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .file-item .file-name { flex: 1; font-size: 0.85rem; }
    .file-item .file-size { font-size: 0.7rem; opacity: 0.5; }
    #file-upload-btn {
      margin-bottom: 12px;
    }
    #camera-feed {
      width: 100%;
      max-height: 300px;
      border-radius: 16px;
      background: #0a111c;
      object-fit: cover;
    }
    .mail-compose {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mail-compose input, .mail-compose textarea {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      outline: none;
      font-family: inherit;
    }
    .mail-compose input:focus, .mail-compose textarea:focus {
      border-color: #00f260;
    }
    #music-player {
      text-align: center;
    }
    #music-player button {
      font-size: 2rem;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      margin: 0 12px;
    }
    .map-container iframe {
      width: 100%;
      height: 300px;
      border: none;
      border-radius: 16px;
    }
  </style>
</head>
<body>
<div id="os">
  <div id="topbar">
    <div id="logo">⟡ ZewpolOS nano <span style="font-size:0.7rem; -webkit-text-fill-color: rgba(255,255,255,0.3);">real actions</span></div>
    <div id="topbar-right">
      <div id="wifi-status" onclick="checkWifi()">
        <span id="wifiIcon">📶</span>
        <span id="wifiText">connecting...</span>
      </div>
      <div id="clock">⏱️ <span id="timeDisplay">--:--</span></div>
    </div>
  </div>

  <div id="workspace">
    <div id="dock">
      <div class="app-icon active" data-app="code"><span>⌨️</span><span class="label">Code</span></div>
      <div class="app-icon" data-app="files"><span>📁</span><span class="label">Files</span></div>
      <div class="app-icon" data-app="terminal"><span>⚡</span><span class="label">Term</span></div>
      <div class="app-icon" data-app="browser"><span>🌐</span><span class="label">Browse</span></div>
      <div class="app-icon" data-app="notes"><span>📝</span><span class="label">Notes</span></div>
      <div class="app-icon" data-app="calc"><span>🧮</span><span class="label">Calc</span></div>
      <div class="app-icon" data-app="paint"><span>🎨</span><span class="label">Paint</span></div>
      <div class="app-icon" data-app="music"><span>🎵</span><span class="label">Music</span></div>
      <div class="app-icon" data-app="weather"><span>🌤️</span><span class="label">Weather</span></div>
      <div class="app-icon" data-app="settings"><span>⚙️</span><span class="label">Settings</span></div>
      <div class="app-icon" data-app="camera"><span>📸</span><span class="label">Camera</span></div>
      <div class="app-icon" data-app="clock"><span>🕒</span><span class="label">Clock</span></div>
      <div class="app-icon" data-app="maps"><span>🗺️</span><span class="label">Maps</span></div>
      <div class="app-icon" data-app="mail"><span>✉️</span><span class="label">Mail</span></div>
      <div class="app-icon" data-app="games"><span>🎮</span><span class="label">Games</span></div>
      <div class="app-icon" data-app="cloudapps"><span>☁️</span><span class="label">Cloud</span></div>
    </div>

    <div id="main">
      <div id="app-header">
        <span id="app-title">⌨️ Code</span>
        <div id="app-actions">
          <button class="btn btn-primary" id="runBtn">▶ run</button>
          <button class="btn" id="resetBtn">↺ reset</button>
          <button class="btn" id="saveBtn">💾 save</button>
        </div>
      </div>
      <div id="app-content">
        <textarea id="code-area" spellcheck="false" wrap="off">// ZewpolOS nano · real actions
console.log("Hello from Zewpol!");
function greet(name) {
  return `Hello, ${name}! Welcome to ZewpolOS.`;
}
// try: alert(greet("Developer"));</textarea>
        <div id="dynamicApp" style="display: none; height: 100%;"></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
  (function() {
    // ---- WiFi ----
    let wifiAvailable = false;
    function checkWifi() {
      const wifiIcon = document.getElementById('wifiIcon');
      const wifiText = document.getElementById('wifiText');
      if ('connection' in navigator) {
        const conn = navigator.connection;
        if (conn) {
          wifiAvailable = true;
          wifiIcon.textContent = '📶';
          wifiText.textContent = 'connected';
          document.getElementById('wifi-status').style.borderColor = 'rgba(74, 222, 128, 0.3)';
          showToast('📶 WiFi: connected to Zewpol-Cloud');
          return;
        }
      }
      if (navigator.onLine !== undefined && navigator.onLine) {
        fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-store', timeout: 3000 })
          .then(() => {
            wifiAvailable = true;
            wifiIcon.textContent = '📶';
            wifiText.textContent = 'connected';
            document.getElementById('wifi-status').style.borderColor = 'rgba(74, 222, 128, 0.3)';
            showToast('📶 WiFi: connected');
          })
          .catch(() => {
            wifiAvailable = false;
            wifiIcon.textContent = '📡';
            wifiText.textContent = 'offline';
            document.getElementById('wifi-status').style.borderColor = 'rgba(248, 113, 113, 0.3)';
            showToast('📡 WiFi: feature not available for this OS');
          });
      } else {
        wifiAvailable = false;
        wifiIcon.textContent = '📡';
        wifiText.textContent = 'offline';
        document.getElementById('wifi-status').style.borderColor = 'rgba(248, 113, 113, 0.3)';
        showToast('📡 WiFi: feature not available for this OS');
      }
    }
    setTimeout(checkWifi, 500);
    window.checkWifi = checkWifi;

    // ---- Clock ----
    function updateClock() {
      const d = new Date();
      document.getElementById('timeDisplay').textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ---- Toast ----
    let toastTimeout;
    function showToast(msg, duration = 2000) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => t.classList.remove('show'), duration);
    }
    window.showToast = showToast;

    // ---- Notes (real) ----
    function saveNote() {
      const title = document.getElementById('noteTitle')?.value || 'Entry';
      const text = document.getElementById('noteText')?.value;
      if (!text) return;
      const notes = JSON.parse(localStorage.getItem('zew_notes') || '[]');
      notes.unshift({ id: Date.now(), title, text });
      localStorage.setItem('zew_notes', JSON.stringify(notes));
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteText').value = '';
      renderNotes();
      showToast('📝 Note saved');
    }
    function deleteNote(id) {
      let notes = JSON.parse(localStorage.getItem('zew_notes') || '[]');
      notes = notes.filter(n => n.id !== id);
      localStorage.setItem('zew_notes', JSON.stringify(notes));
      renderNotes();
      showToast('🗑️ Note deleted');
    }
    function renderNotes() {
      const list = document.getElementById('notesList');
      if (!list) return;
      const notes = JSON.parse(localStorage.getItem('zew_notes') || '[]');

    function terminalPrint(text) {
      const out = document.getElementById('terminal-output');
      if (out) out.innerHTML += text + '\n';
    }
    function terminalClear() {
      const out = document.getElementById('terminal-output');
      if (out) out.innerHTML = '';
    }
    function terminalHandleCommand(cmd) {
      const parts = cmd.trim().split(' ');
      const command = parts[0];
      const args = parts.slice(1);
      let output = '';
      switch(command) {
        case 'echo': output = args.join(' '); break;
        case 'whoami': output = 'developer'; break;
        case 'date': output = new Date().toString(); break;
        case 'ls': output = 'apps/  docs/  code/  sys/  notes.txt  README.md'; break;
        case 'pwd': output = '/' + terminalState.cwd; break;
        case 'clear': terminalClear(); return;
        case 'help': output = 'Commands: echo, whoami, date, ls, pwd, clear, help, uptime, free'; break;
        case 'uptime': output = Math.floor(Math.random() * 24) + 'h ' + Math.floor(Math.random() * 60) + 'm'; break;
        case 'free': output = '8.2G / 16G'; break;
        default: output = 'Command not found: ' + command;
      }
      if (output) terminalPrint('$ ' + cmd + '\n' + output);
    }
    function terminalSubmit() {
      const input = document.getElementById('terminal-input');
      if (!input) return;
      const cmd = input.value.trim();
      if (!cmd) return;
      terminalPrint('$ ' + cmd);
      terminalHandleCommand(cmd);
      input.value = '';
      const out = document.getElementById('terminal-output');
      if (out) out.scrollTop = out.scrollHeight;
    }

    // ---- Paint (real canvas) ----
    let paintCtx = null, paintDrawing = false, paintColor = '#00f260', paintSize = 4;
    function initPaint(canvas) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      paintCtx = ctx;
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      ctx.fillStyle = '#0a111c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = paintColor;
      ctx.lineWidth = paintSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const startDraw = (e) => {
        paintDrawing = true;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        ctx.beginPath();
        ctx.moveTo(x, y);
      };
      const draw = (e) => {
        if (!paintDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
      };
      const endDraw = () => { paintDrawing = false; ctx.beginPath(); };
      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', endDraw);
      canvas.addEventListener('mouseleave', endDraw);
      canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
      canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
      canvas.addEventListener('touchend', endDraw);
    }
    function clearPaint(canvas) {
      if (!paintCtx) return;
      paintCtx.fillStyle = '#0a111c';
      paintCtx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // ---- Music (real Web Audio) ----
    let audioCtx = null, osc = null, gain = null;
    function playTone(freq, duration = 500) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (osc) { osc.stop(); osc.disconnect(); }
      osc = audioCtx.createOscillator();
      gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      setTimeout(() => {
        if (osc) { osc.stop(); osc.disconnect(); osc = null; }
      }, duration);
    }

    // ---- Camera (real getUserMedia) ----
    let cameraStream = null;
    function startCamera(videoEl) {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(stream => {
          cameraStream = stream;
          videoEl.srcObject = stream;
          videoEl.play();
          showToast('📸 Camera started');
        })
        .catch(err => {
          showToast('❌ Camera error: ' + err.message);
        });
    }
    function takePhoto(videoEl, canvasEl) {
      if (!cameraStream) {
        showToast('📸 Start camera first');
        return;
      }
      const canvas = canvasEl;
      canvas.width = videoEl.videoWidth;
      canvas.height = videoEl.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoEl, 0, 0);
      showToast('📸 Photo captured!');
      // Download
      const link = document.createElement('a');
      link.download = 'photo-' + Date.now() + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

      const container = document.getElementById('weather-display');

      container.innerHTML = '🌤️ Loading weather...';
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        // Use wttr.in (free, no key)
        fetch(`https://wttr.in/${lat},${lon}?format=%C+%t+%w&lang=en`)
          .then(res => res.text())
          .then(data => {
            const parts = data.split(' ');
            const condition = parts.slice(0, -2).join(' ');
            const temp = parts[parts.length-2];
            const wind = parts[parts.length-1];
            container.innerHTML = `
              <div style="font-size:3rem;">🌤️</div>
              <div style="font-size:2rem;">${temp}</div>
              <div>${condition}</div>
              <div>Wind: ${wind}</div>
            `;
          })
          .catch(() => {
            container.innerHTML = '❌ Weather unavailable';
          });
      }, () => {
        // Fallback: use IP location approximate
        fetch('https://wttr.in?format=%C+%t+%w&lang=en')
          .then(res => res.text())
          .then(data => {
            const parts = data.split(' ');
            const condition = parts.slice(0, -2).join(' ');

              <div style="font-size:2rem;">${temp}</div>
              <div>${condition}</div>

          document.getElementById('app-title').innerHTML = '🗺️ Maps';
          showToast('🗺️ map loaded');
        }
      },
      mail: {
        label: 'Mail', icon: '✉️',
        render: () => {
          document.getElementById('code-area').style.display = 'none';
          const dyn = document.getElementById('dynamicApp');
          dyn.style.display = 'block';
          dyn.innerHTML = `<div class="desktop-window">
            <div class="mail-compose">
              <input type="text" id="mail-to" placeholder="To:" />
              <input type="text" id="mail-subject" placeholder="Subject:" />
              <textarea id="mail-body" rows="5" placeholder="Write your message..."></textarea>
              <button class="btn btn-primary" onclick="sendMail()">✉️ Send</button>
            </div>
            <div style="margin-top:16px; border-top:1px solid rgba(255,255,255,0.05); padding-top:12px;">
              <div class="file-item"><span>📩 Inbox (3 unread)</span></div>
              <div class="file-item"><span>📤 Sent (12)</span></div>
            </div>
          </div>`;
          document.getElementById('app-title').innerHTML = '✉️ Mail';
          window.sendMail = function() {
            const to = document.getElementById('mail-to').value;
            const subject = document.getElementById('mail-subject').value;
            const body = document.getElementById('mail-body').value;
            if (!to || !body) { showToast('❌ Please fill To and Body'); return; }
            const mailto = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.open(mailto, '_blank');
            showToast('✉️ Mail client opened');
          };
          showToast('✉️ mail ready');
        }
      },
      games: {
        label: 'Games', icon: '🎮',
        render: () => {
          document.getElementById('code-area').style.display = 'none';
          const dyn = document.getElementById('dynamicApp');
          dyn.style.display = 'block';
          dyn.innerHTML = `<div class="desktop-window">
            <div class="app-grid">
              ${[
                ['🎮', 'Snake', 'showToast("🐍 Snake game loading...")'],
                ['🕹️', 'Pong', 'showToast("🏓 Pong game loading...")'],
                ['🧩', 'Puzzle', 'showToast("🧩 Puzzle loading...")'],
                ['🎯', 'Darts', 'showToast("🎯 Darts loading...")'],
                ['🏎️', 'Racing', 'showToast("🏎️ Racing loading...")'],
                ['🃏', 'Cards', 'showToast("🃏 Cards loading...")'],
                ['🎲', 'Dice', 'showToast("🎲 Rolling dice...")'],
                ['⚽', 'Soccer', 'showToast("⚽ Soccer loading...")']
              ].map(([emoji, name, action]) =>
                `<div class="app-card" onclick="${action}"><span class="emoji-big">${emoji}</span><span class="label">${name}</span></div>`
              ).join('')}
            </div>
            <div style="text-align:center; margin-top:16px;">
              <span class="btn" onclick="showToast('🎮 Opening arcade...')">🕹️ Full Arcade</span>
            </div>
          </div>`;
          document.getElementById('app-title').innerHTML = '🎮 Games';
          showToast('🎮 game center');
        }
      },
      cloudapps: {
        label: 'Cloud Apps', icon: '☁️',
        render: () => {
          document.getElementById('code-area').style.display = 'none';
          const dyn = document.getElementById('dynamicApp');
          dyn.style.display = 'block';
          const base = 'https://zewpol.neocities.org/';
          const categories = [
            { title: 'Core Ecosystem', apps: [
              ['zewpolcloud.html', 'fa-cloud', 'Files'],
              ['zewmaps.html', 'fa-map-location-dot', 'Maps'],
              ['streamtv.html', 'fa-tv', 'Stream'],
              ['zewai.html', 'fa-robot', 'AI Chat'],
              ['zewpolforms.html', 'fa-file-lines', 'Forms'],
              ['radio.html', 'fa-radio', 'Radio'],
              ['whiteboard.html', 'fa-marker', 'Whiteboard'],
              ['ridescreen.html', 'fa-car', 'Car mirror'],
              ['Music.html', 'fa-headphones', 'Music player'],
              ['Zewtext.html', 'fa-file', 'Text editor'],
              ['status.html', 'fa-gear', 'Status'],
              ['apps.html', 'fa-plus', 'Store']
            ]},
            { title: 'Arcade', apps: [
              ['zewpolgame1.html', 'fa-spell-check', 'Wordle'],
              ['zewpolgame2.html', 'fa-cubes', 'Blocks'],
              ['endlessdash.html', 'fa-skull', 'Endless dash'],
              ['stickmanjumper.html', 'fa-fort-awesome', 'Stickman'],
              ['DevelopTheDream_Competition_v2.html', 'fa-trophy', 'Dream'],
              ['zewpolgame3.html', 'fa-laptop', 'Arcade'],
              ['Zensmaker.html', 'fa-person', 'Zens avatar'],
              ['pong.html', 'fa-table-tennis', 'Super pong']
            ]},
            { title: 'Dev', apps: [
              ['zewcomp.html', 'fa-desktop', 'VM'],
              ['Zewcreatorstudio.html', 'fa-pencil', 'Creator Studio'],
              ['devcollab.html', 'fa-users-gear', 'Devcollab'],
              ['superweb.html', 'fa-globe', 'Superweb'],
              ['zoss.html', 'fa-git-alt', 'GitHub'],
              ['zewjswww.html', 'fa-js', 'JS Tester'],
              ['zewserver.html', 'fa-server', 'Server'],
              ['zewcode.html', 'fa-code', 'IDE'],
              ['zewpolcloudshell.html', 'fa-database', 'Cloud shell'],
              ['zewgear.html', 'fa-wrench', 'Gear maker'],
              ['api.html', 'fa-key', 'API'],
              ['zewcode-max.html', 'fa-laptop-code', 'VS Code']
            ]}
          ];
          let html = `<div class="desktop-window">`;
          categories.forEach(cat => {
            html += `<div class="cloud-apps-section-title">${cat.title}</div>`;
            html += `<div class="cloud-apps-grid">`;
            cat.apps.forEach(([file, icon, label]) => {
              const href = base + file;
              html += `<a href="${href}" target="_blank" class="cloud-app-card">
                <i class="fa-solid ${icon}"></i>
                <span>${label}</span>
              </a>`;
            });
            html += `</div>`;
          });
          html += `</div>`;
          dyn.innerHTML = html;
          document.getElementById('app-title').innerHTML = '☁️ Cloud Apps · neocities';
          showToast('☁️ cloud apps loaded');
        }
      }
    };

    // ---- Dock events ----
    const dockIcons = document.querySelectorAll('.app-icon');
    dockIcons.forEach(el => {
      el.addEventListener('click', () => {
        const appKey = el.dataset.app;
        if (appKey && appRegistry[appKey]) {
          document.querySelectorAll('.app-icon').forEach(i => i.classList.remove('active'));
          el.classList.add('active');
          appRegistry[appKey].render();
        } else {
          showToast('⏳ app not available');
        }
      });
    });

    // ---- Code actions ----
    document.getElementById('runBtn').addEventListener('click', () => {
      const code = document.getElementById('code-area').value;
      try {
        const result = eval(code);
        showToast('✅ executed · see console');
        console.log('[Zewpol] output:', result);
      } catch (e) {
        showToast('⚠️ error: ' + e.message);
        console.error(e);
      }
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('code-area').value = '// ZewpolOS nano · reset\nconsole.log("fresh start!");';
      showToast('↺ reset');
    });
    document.getElementById('saveBtn').addEventListener('click', () => {
      const code = document.getElementById('code-area').value;
      try {
        localStorage.setItem('zewpol_code', code);
        showToast('💾 saved');
      } catch(e) { showToast('⚠️ save failed'); }
    });
    try {
      const saved = localStorage.getItem('zewpol_code');
      if (saved) document.getElementById('code-area').value = saved;
    } catch(e) {}

    // ---- Default: code ----
    document.querySelector('[data-app="code"]')?.click();

    // ---- Periodically check WiFi ----
    setInterval(() => {
      if (navigator.onLine !== undefined && !navigator.onLine) {
        document.getElementById('wifiIcon').textContent = '📡';
        document.getElementById('wifiText').textContent = 'offline';
        document.getElementById('wifi-status').style.borderColor = 'rgba(248, 113, 113, 0.3)';
      }
    }, 30000);

    // Expose for inline onclick
    window.showToast = showToast;
    window.checkWifi = checkWifi;
    window.saveNote = saveNote;
    window.deleteNote = deleteNote;
    window.renderNotes = renderNotes;
    window.calcInput = window.calcInput || function(){};
    window.terminalSubmit = terminalSubmit;
    window.startCamera = startCamera;
    window.takePhoto = takePhoto;
    window.playTone = playTone;
    window.fetchWeather = fetchWeather;
    window.loadBrowser = loadBrowser;
    window.setPaintColor = setPaintColor;
    window.clearPaint = clearPaint;
    window.initPaint = initPaint;
    window.paintColor = paintColor;
    window.paintSize = paintSize;
    window.paintCtx = paintCtx;

    // Load weather function
    window.fetchWeather = fetchWeather;

    // Paint helper exposed
    window.setPaintColor = function(color, el) {
      paintColor = color;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      if (el) el.classList.add('active');
      if (paintCtx) paintCtx.strokeStyle = color;
    };
    window.clearPaint = function(canvas) {
      if (!paintCtx) return;
      paintCtx.fillStyle = '#0a111c';
      paintCtx.fillRect(0, 0, canvas.width, canvas.height);
      showToast('🧹 canvas cleared');
    };

  })();
</script>
</body>
</html>
